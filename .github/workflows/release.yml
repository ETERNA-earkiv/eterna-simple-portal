name: 'Release'

# Produktionsimage. Triggas av en versionstagg, t.ex. v1.2.3.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Bygg och testa utan att pusha imagen'
        type: boolean
        default: true

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  IMAGE: ghcr.io/eterna-earkiv/eterna-simple-portal

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Taggarna nedan kommer från type=semver, som bara ger något på en v-tagg.
    # Utan tagg finns inget att pusha, så push kräver båda villkoren — annars
    # dör bygget på "tag is needed when pushing to registry".
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run check

      # Taggen är källan till versionen. Går den isär från package.json är det
      # nästan alltid package.json som glömts — stoppa hellre releasen här än
      # att publicera en image med fel version i metadatan.
      - name: Kontrollera att taggen matchar package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Taggen är v$TAG_VERSION men package.json säger $PKG_VERSION."
            exit 1
          fi
          echo "Version $PKG_VERSION bekräftad."

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          push: ${{ env.PUSH }}
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attestera bygget
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sammanfattning
        run: |
          {
            if [ "${{ env.PUSH }}" = "true" ]; then
              echo "### Produktionsimage publicerad"
              echo ""
              echo "Taggar:"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            else
              echo "### Ingen image pushad — bara byggd och testad"
              echo ""
              echo "Produktionsimages byggs bara av en v-tagg som matchar package.json."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
