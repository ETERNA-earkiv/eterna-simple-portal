name: 'Test Image'

# Byggs bara på begäran. Ger en image att testa innan en riktig release taggas.
on:
  workflow_dispatch:
    inputs:
      extra_tag:
        description: 'Extra tagg utöver :dev och :sha-<commit> (valfritt, t.ex. "smoke-test")'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/eterna-earkiv/eterna-simple-portal

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run check

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Sammanfattning
        run: |
          {
            echo "### Test-image byggd"
            echo ""
            echo "Taggar:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Kör den med:"
            echo '```bash'
            echo "docker run -p 4321:4321 \\"
            echo "  -e ETERNA_API_URL=https://<din-eterna> \\"
            echo "  -e PORTAL_SERVICE_USER=<konto> \\"
            echo "  -e PORTAL_SERVICE_PASSWORD=<lösenord> \\"
            echo "  ${{ env.IMAGE }}:dev"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
